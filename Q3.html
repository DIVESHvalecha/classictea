<!DOCTYPE html>
<html>
  <head>
    <title>CSS3</title>
    <style>
      body {
        background-color: lightgreen;
        font-family: "Arial";
      }
      h1 {
        color: darkgreen;
        font-size: 18px;
      }
      table {
        border-collapse: collapse;
        color: light green;
      }
      th,
      td {
        border: 2px solid black;
        padding: 5px;
      }
      ul li {
        color: brown;
      }
      ul li hover {
        color: red;
      }
    </style>
    <body>
      <h1>CSS3 Application</h1>
      <p>This is a paragraph with color, font, and background.</p>
      <table>
        <tr>
          <th>Name</th>
          <th>Score</th>
        </tr>
        <tr>
          <td>Riya</td>
          <td>90</td>
        </tr>
        <tr>
          <td>Arjun</td>
          <td>85</td>
        </tr>
      </table>

      <ul>
        <li>HTML</li>
        <li>CSS</li>
        <li>JavaScript</li>
      </ul>
    </body>
  </head>
</html>
